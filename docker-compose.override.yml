# Development overrides - use with: docker compose -f docker-compose.yml -f docker-compose.override.yml up
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    ports:
      - "9000:9000"

  nginx:
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"

  meilisearch:
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY:-your_meilisearch_master_key}
      - MEILI_ENV=development

  vite:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: build
    container_name: erp-vite
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node-modules:/app/node_modules
    networks:
      - erp-network
    environment:
      - NODE_ENV=development
